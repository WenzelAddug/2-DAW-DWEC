<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 5 - Frecuencias</title>
    <script>
      //la clave es el numero y el valor las veces que ha salido
      var frecuencias=new Map();
      for (let i=1;i<=10;i++){
        frecuencias.set(i,0);
      }

      for (let i=0;i<10000;i++){
        let numero=Math.floor(Math.random()*10)+1;
        frecuencias.set(numero,frecuencias.get(numero)+1);
      }

      document.write("<h3>FRECUENCIAS</h3>");
      for ([clave,valor] of frecuencias){
        document.write("Número " + clave + ": " + valor + "<br>");
      }
    </script>
  </head>
  <body>
  </body>
</html>
