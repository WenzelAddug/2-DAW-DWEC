<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Asteriscos</title>
    <script>
      var numeros=[];

      for (let i=0;i<20;i++){
        numeros.push(Math.floor(Math.random()*50)+1);
      }

      for (let valor of numeros){
        document.write(valor + ": ");
        for (let j=0;j<valor;j++){
          document.write("*");
        }
        document.write("<br>");
      }
    </script>
  </head>
  <body>
  </body>
</html>
