<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Asteriscos</title>
    <script>
      function getRandomInt(min, max) {
        return Math.floor(Math.random() * (max - min)) + min;
      }

      var numeros=new Array();

      //20 numeros aleatorios del 1 al 50
      for (let i=0;i<20;i++){
        numeros.push(getRandomInt(1,51));
      }

      document.write("<h2>Asteriscos para un array</h2>");
      document.write("<p>Array: " + numeros.join(", ") + "</p>");

      for (let valor of numeros){
        var asteriscos="";
        for (let j=0;j<valor;j++){
          asteriscos=asteriscos + "*";
        }
        document.write(valor + ": " + asteriscos + "<br>");
      }
    </script>
  </head>
  <body>
  </body>
</html>
