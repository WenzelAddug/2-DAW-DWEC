<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Lotería primitiva</title>
    <script>
      for (let i=1;i<=50;i++){
        //el Set no deja meter numeros repetidos
        var combinacion=new Set();
        while (combinacion.size<6){
          combinacion.add(Math.floor(Math.random()*49)+1);
        }
        document.write("Combinación " + i + ": " + [...combinacion] + "<br>");
      }
    </script>
  </head>
  <body>
  </body>
</html>
