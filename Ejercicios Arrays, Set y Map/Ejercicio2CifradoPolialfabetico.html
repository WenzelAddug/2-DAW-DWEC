<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 2 - Cifrado polialfabético</title>
    <script>
      var mensaje=prompt("Escribe el mensaje");
      var clave;

      //la clave tiene que ser un numero
      do{
        clave=prompt("Escribe la clave (solo números)");
      }while(isNaN(clave))

      var cifrado="";
      var j=0;

      for (let i=0;i<mensaje.length;i++){
        cifrado+=String.fromCharCode(mensaje.charCodeAt(i) + parseInt(clave[j]));
        //cuando se acaba la clave se empieza otra vez
        j++;
        if (j==clave.length){
          j=0;
        }
      }

      document.write("Mensaje: " + mensaje + "<br>");
      document.write("Clave: " + clave + "<br>");
      document.write("Mensaje cifrado: " + cifrado);
    </script>
  </head>
  <body>
  </body>
</html>
