<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Array sin repetidos</title>
    <script>
      var numeros=[4,0,3,4,7,3,5,8,1,8,8,0,2,3,1,2,5,7,3,2,5,1];
      var sinRepetidos=[];

      //solo guardo el numero si todavia no esta en el array nuevo
      for (let valor of numeros){
        if (!sinRepetidos.includes(valor)){
          sinRepetidos.push(valor);
        }
      }

      document.write("Array original: " + numeros + "<br>");
      document.write("Array sin repetidos: " + sinRepetidos);
    </script>
  </head>
  <body>
  </body>
</html>
