<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Array sin repetidos</title>
    <script>
      var numeros=[4,0,3,4,7,3,5,8,1,8,8,0,2,3,1,2,5,7,3,2,5,1];
      var sinRepetidos=[];

      //recorro el array y solo guardo el numero si todavia no esta
      for (let valor of numeros){
        if (!sinRepetidos.includes(valor)){
          sinRepetidos.push(valor);
        }
      }

      document.write("<h2>Array sin elementos repetidos</h2>");
      document.write("<p>Array original: " + numeros.join(", ") + "</p>");
      document.write("<p>Array sin repetidos: " + sinRepetidos.join(", ") + "</p>");

      //otra forma: con un Set, que no admite duplicados
      var conjunto=new Set(numeros);
      var sinRepetidos2=[...conjunto];
      document.write("<p>Con Set: " + sinRepetidos2.join(", ") + "</p>");
    </script>
  </head>
  <body>
  </body>
</html>
