<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Palíndromos</title>
    <script>
      var texto=prompt("Escribe un texto");

      var conTilde="áéíóúü";
      var sinTilde="aeiouu";
      var letras="abcdefghijklmnñopqrstuvwxyz0123456789";

      //no se distingue entre mayusculas y minusculas
      var minusculas=texto.toLowerCase();
      var limpio="";

      for (let caracter of minusculas){
        //si tiene tilde o dieresis lo cambio por la vocal normal
        let pos=conTilde.indexOf(caracter);
        if (pos!=-1){
          caracter=sinTilde.charAt(pos);
        }
        //solo me quedo con letras y numeros (fuera espacios, comas, puntos...)
        if (letras.includes(caracter)){
          limpio=limpio + caracter;
        }
      }

      //le doy la vuelta al texto usando un array
      var alReves=limpio.split("").reverse().join("");

      document.write("<h2>Palíndromos</h2>");
      document.write("<p>Texto: " + texto + "</p>");
      if (limpio.length>0 && limpio==alReves){
        document.write("<p>El texto SÍ es un palíndromo</p>");
      }else{
        document.write("<p>El texto NO es un palíndromo</p>");
      }
    </script>
  </head>
  <body>
  </body>
</html>
