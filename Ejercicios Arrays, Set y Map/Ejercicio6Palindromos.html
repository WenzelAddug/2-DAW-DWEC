<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Ejercicio 6 - Palíndromos</title>
    <script>
      var texto=prompt("Escribe un texto");
      var conTilde="áéíóúü";
      var sinTilde="aeiouu";
      var letras="abcdefghijklmnñopqrstuvwxyz";
      var limpio="";

      for (let caracter of texto.toLowerCase()){
        //quito la tilde o la dieresis
        if (conTilde.includes(caracter)){
          caracter=sinTilde[conTilde.indexOf(caracter)];
        }
        //los espacios y signos de puntuacion no se guardan
        if (letras.includes(caracter)){
          limpio+=caracter;
        }
      }

      var alReves=limpio.split("").reverse().join("");

      if (limpio==alReves){
        document.write(texto + " SÍ es un palíndromo");
      }else{
        document.write(texto + " NO es un palíndromo");
      }
    </script>
  </head>
  <body>
  </body>
</html>
