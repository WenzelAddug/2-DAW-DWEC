<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Cifrado Cesar</title>
    <script>
        function cifrar() {
            let texto = document.getElementById("texto").value;
            let clave = parseInt(document.getElementById("clave").value);
            let resultado = "";

            if (isNaN(clave)) {
                alert("La clave tiene que ser un numero");
                return;
            }

            for (let i = 0; i < texto.length; i++) {
                let codigo = texto.charCodeAt(i) + clave;
                resultado = resultado + String.fromCharCode(codigo);
            }

            document.getElementById("resultado").value = resultado;
        }
    </script>
</head>
<body>
    <h2>Cifrado estilo Cesar</h2>

    Texto: <input type="text" id="texto" size="40">
    <br><br>
    Clave: <input type="text" id="clave" size="3">
    <br><br>
    <button type="button" onclick="cifrar();">Cifrar</button>
    <br><br>
    Resultado: <input type="text" id="resultado" size="40" readonly>
</body>
</html>
