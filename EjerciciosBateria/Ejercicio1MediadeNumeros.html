<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1 - Media de numeros</title>
    <script>
        let numeros = [];

        function calcularMedia() {
            let suma = 0;

            if (numeros.length == 0) {
                alert("No has escrito ningun numero");
                return;
            }

            for (let i = 0; i < numeros.length; i++) {
                suma = suma + numeros[i];
            }

            document.getElementById("media").value = suma / numeros.length;
            numeros = [];
        }

        function anadir() {
            let caja = document.getElementById("numero");
            let n = parseFloat(caja.value);

            if (isNaN(n)) {
                alert("Escribe un numero");
            } else if (n == 0) {
                calcularMedia();
            } else {
                numeros.push(n);
            }

            caja.value = "";
            caja.focus();
        }

        function conPrompt() {
            let entrada;
            let n;
            numeros = [];

            do {
                entrada = prompt("Escribe un numero (0 para terminar)");
                n = parseFloat(entrada);
                if (entrada != null && !isNaN(n) && n != 0) {
                    numeros.push(n);
                }
            } while (entrada != null && n != 0);

            calcularMedia();
        }
    </script>
</head>
<body>
    <h2>Media de una serie de numeros</h2>
    <p>Escribe numeros y pulsa Añadir. Escribe 0 para terminar.</p>

    Numero: <input type="text" id="numero">
    <button type="button" onclick="anadir();">Añadir</button>
    <br><br>
    <button type="button" onclick="conPrompt();">Hacerlo con prompt</button>
    <br><br>
    Media: <input type="text" id="media" readonly>
</body>
</html>
