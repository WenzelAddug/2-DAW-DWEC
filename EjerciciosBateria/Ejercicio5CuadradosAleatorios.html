<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cuadrados aleatorios</title>
    <style>
        div{
            position:fixed;
            width:50px;
            height:50px;
        }
    </style>
</head>
<body>
<script>
    for (let i = 0; i < 2000; i++) {
        let r = Math.floor(Math.random() * 256);
        let g = Math.floor(Math.random() * 256);
        let b = Math.floor(Math.random() * 256);
        let arriba = Math.floor(Math.random() * 100);
        let izquierda = Math.floor(Math.random() * 100);

        document.write("<div style='background-color:rgb(" + r + "," + g + "," + b + ");"
            + "top:" + arriba + "%;left:" + izquierda + "%;'></div>");
    }
</script>
</body>
</html>
