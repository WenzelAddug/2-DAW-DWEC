<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso select</title>
</head>
<body>
    <form action="">
        <b><i>Selecciona el tipo o tipos de música que te gusta</i></b><br><br>
        <select id="musica" multiple size="4">
            <option value="Rock&Roll">Rock&Roll</option>
            <option value="Clásica">Clásica</option>
            <option value="Heavy">Heavy</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Tecno">Tecno</option>
        </select><br><br>
        <textarea id="pantalla" cols="30" rows="10"></textarea><br><br>
        <input type="button" value="Visualizar" onclick="visualizar();">
    </form>
    <script>
        // funcion que se ejecuta al pulsar el boton "Visualizar"
        function visualizar(){
            // el select es el elemento 0 del formulario y el textarea el 1
            var musica=document.forms[0].elements[0];
            var pantalla=document.forms[0].elements[1];
            var seleccion="";

            // recorro las opciones y guardo las que estan seleccionadas
            for (let i=0; i<musica.options.length; i++){
                if (musica.options[i].selected){
                    seleccion+=musica.options[i].text + "\n";
                }
            }

            // si no ha elegido nada lo aviso
            if (seleccion==""){
                pantalla.value="No has elegido ningun tipo de musica";
            }
            else{
                pantalla.value="Te gusta:\n" + seleccion;
            }
        }
    </script>
</body>
</html>
