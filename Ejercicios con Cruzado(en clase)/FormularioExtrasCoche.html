<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uso Input tipo radio y check</title>
</head>
<body>
    <center>
        <form action="" name="form-extras">
            <table>
                <tr><td><label for="">Nombre</label></td><td><input type="text" id="nombre"></td><td></td></tr>
                <tr><td><label for="">Apellidos</label></td><td><input type="text" id="apellidos"></td><td></td></tr>
                <tr><td><label for="">Forma de pago </label></td><td><input type="radio" name="gruporadio" value="Mensual">Mensual</td><td><input type="radio" name="gruporadio" value="Trimestral">Trimestral</td><td><input type="radio" name="gruporadio" value="anual">Anual</td></tr>
                <tr><td><label for="">Accesorios</label></td><td><input type="checkbox" name="SEGURO" value="Seguro">Todo riesgo</td><td><input type="checkbox" name="Enchufable" value="Enchufable">Enchufable</td><td><input type="checkbox" name="Aleacion" value="Aleacion">Llantas de aleación</td></tr>
                <tr><td></td><td><input type="button" value="Ver selecciones" name="VER" onClick="VerSeleccion()"></td><td></td></tr>
                <tr><td></td><td></td><td></td></tr>
            </table>
            <label for="">INFORME: </label><br><br>
            <textarea name="pantalla" id="" cols="30" rows="10"></textarea>
        </form>
    </center>
</body>
<script>
    // funcion que se ejecuta al pulsar el boton "Ver selecciones"
    function VerSeleccion(){
        // cojo los datos del formulario
        var nombre=document.forms[0].elements[0].value;
        var apellidos=document.forms[0].elements[1].value;
        var pagos=document.getElementsByName("gruporadio");
        var inputs=document.getElementsByTagName("input");

        var pago="";
        var extras="";
        var total=0;

        // compruebo que el nombre y los apellidos no esten vacios
        if (nombre=="" || apellidos==""){
            alert("Escribe el nombre y los apellidos");
            return;
        }

        // miro que forma de pago esta marcada
        for (let i=0; i<pagos.length; i++){
            if (pagos[i].checked){
                pago=pagos[i].value;
            }
        }

        if (pago==""){
            alert("Elige una forma de pago");
            return;
        }

        // recorro los input y me quedo con los checkbox marcados
        for (let i=0; i<inputs.length; i++){
            if (inputs[i].type=="checkbox" && inputs[i].checked){
                extras+=inputs[i].value + " ";

                // sumo el precio de cada extra
                switch (inputs[i].value){
                    case "Seguro":
                        total+=650;
                        break;
                    case "Enchufable":
                        total+=6500;
                        break;
                    case "Aleacion":
                        total+=2500;
                        break;
                }
            }
        }

        if (extras==""){
            extras="Ninguno";
        }

        // muestro el informe en el textarea
        document.getElementsByName("pantalla")[0].value="Cliente: " + nombre + " " + apellidos + "\n" + "Forma de pago: " + pago + "\n" + "Extras: " + extras + "\n" + "Total de los extras: " + total + " euros";
    }
</script>
     
</html>
